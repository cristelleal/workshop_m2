# Déploiement sur le host du lab (contrat espace-de-travail-devs.md) :
# - la base `db` est fournie par /opt/resilience/app/compose.yaml (pas de Postgres ici)
# - pas de `ports:` publiés, seulement `expose:` (le WAF est l'entrée)
# - tous les services rejoignent le réseau externe `resilience-net`
# En local : docker compose -f docker-compose.yml -f docker-compose.local.yml up --build

services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-db}:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8000"
    networks:
      - resilience-net

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - resilience-net

networks:
  resilience-net:
    external: true
